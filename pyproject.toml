[project]
name = "engram-runtime"
version = "0.1.0"
description = "Local-first AI runtime with compact context and reusable execution experience"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yixzus360" }]
keywords = ["ai-agents", "local-first", "model-routing", "ollama", "openai", "pgvector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastembed>=0.7,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "orjson>=3.10,<4",
  "openai>=2.30,<3",
  "pgvector>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/Yixzus360/engram-runtime"
Repository = "https://github.com/Yixzus360/engram-runtime"
Issues = "https://github.com/Yixzus360/engram-runtime/issues"

[project.optional-dependencies]
universal = ["litellm>=1.80,<2"]
longmemeval = [
  "huggingface-hub>=0.34,<2",
  "numpy>=2,<3",
  "openai-agents>=0.3,<1",
  "pillow>=11,<13",
  "tqdm>=4.67,<5",
  "transformers>=4.55,<6",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
engram = "engram_runtime.cli:main"
engram-mcp = "engram_runtime.mcp_server:main"
engram-benchmark = "engram_runtime.evaluation:main"
engram-science = "engram_runtime.scientific_evaluation:main"
engram-debate = "engram_runtime.blind_debate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
